<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12162f" />
  <meta name="color-scheme" content="dark" />
  <title>STADO</title>
  <link rel="stylesheet" href="style.css?v=1.3.7" />
</head>
<body>
  <div id="app" aria-live="polite">
    <main class="app-shell start-shell startup-fallback">
      <div class="topbar"><div class="logo">ST<span class="pink">ADO</span></div></div>
      <section class="start-hero">
        <article class="card light start-panel">
          <h1>STADO</h1><h2>Czy umiesz myśleć jak reszta owiec?</h2>
          <p>Imprezowa gra o tym, czy pójdziesz za Stadem… czy zostaniesz Czarną Owcą.</p>
          <div class="start-actions">
            <button class="start-action host" data-action="create-game">▣ UTWÓRZ GRĘ<span>Będę ekranem głównym — komputer, tablet lub TV</span></button>
            <button class="start-action join" data-action="join-game">▯ DOŁĄCZ DO GRY<span>Gram na tym telefonie i tworzę swoją Owcę</span></button>
          </div>
        </article>
        <div class="scene-wrap"><img src="assets/scenes/start.png" alt="Stado"></div>
      </section>
    </main>
  </div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>

  <audio id="music1" src="music/music1.mp3" loop preload="auto" playsinline></audio>
  <audio id="music2" src="music/music2.mp3" loop preload="auto" playsinline></audio>
  <audio id="music3" src="music/music3.mp3" loop preload="auto" playsinline></audio>
  <audio id="music4" src="music/music4.mp3" loop preload="auto" playsinline></audio>
  <audio id="music5" src="music/music5.mp3" loop preload="auto" playsinline></audio>
  <audio id="music6" src="music/music6.mp3" loop preload="auto" playsinline></audio>
  <audio id="music7" src="music/music7.mp3" loop preload="auto" playsinline></audio>
  <audio id="music8" src="music/music8.mp3" loop preload="auto" playsinline></audio>
  <audio id="music9" src="music/music9.mp3" loop preload="auto" playsinline></audio>
  <audio id="music10" src="music/music10.mp3" loop preload="auto" playsinline></audio>
  <audio id="timerEndSound" src="music/timer-end.mp3" preload="auto" playsinline></audio>

  <script src="data/sheep.js?v=1.3.7"></script>
  <script src="data/questions.js?v=1.3.7"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js?v=1.3.7"></script>
</body>
</html>
