<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#11152b" />

  <title>STADO - imprezowa gra o owcach</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="app"></div>

  <audio
    id="bgMusic"
    src="muzyka.mp3"
    loop
    preload="auto"
    playsinline>
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>

  <script>
    const bgMusic = document.getElementById("bgMusic");

    bgMusic.volume = 0.35;

    async function startMusic() {
      try {
        if (bgMusic.paused) {
          await bgMusic.play();
        }
      } catch (error) {
        console.log("Muzyka czeka na interakcję użytkownika:", error);
      }
    }

    // Pierwsze kliknięcie lub dotknięcie strony uruchamia muzykę.
    document.addEventListener("pointerdown", startMusic, { once: true });
    document.addEventListener("keydown", startMusic, { once: true });

    // Dodatkowa próba po kliknięciu dowolnego przycisku.
    document.addEventListener("click", function(event) {
      if (event.target.closest("button")) {
        startMusic();
      }
    });
  </script>

</body>
</html>
